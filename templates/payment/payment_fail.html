{% extends "../base.html" %}
{% load static %}

{% block title %}Payment Failed{% endblock title %}

{% block content %}

<section class="page-add">
    <div class="container">
        <div class="row">
            <div class="col-lg-4">
                <div class="page-breadcrumb">
                    <h3>Payment Failed</h3>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="contact-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="contact-form text-center">

                    <h2 class="mb-4 text-danger">
                        Payment Failed
                    </h2>

                    <p>
                        We could not process your payment.
                    </p>

                    <p>
                        Please try again later.
                    </p>

                    <div class="mt-4">
                        <a href="{% url 'checkout' %}" class="site-btn">
                            Try Again
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

{% endblock content %}
