{% extends "../base.html" %}
{% load static %}

{% block title %}Payment Cancelled{% endblock title %}

{% block content %}

<section class="page-add">
    <div class="container">
        <div class="row">
            <div class="col-lg-4">
                <div class="page-breadcrumb">
                    <h3>Payment Cancelled</h3>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="contact-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="contact-form text-center">

                    <h2 class="mb-4 text-warning">
                        Payment Cancelled
                    </h2>

                    <p>
                        You have cancelled the payment process.
                    </p>

                    <p>
                        Your order has not been completed.
                    </p>

                    <div class="mt-4">
                        <a href="{% url 'checkout' %}" class="site-btn">
                            Return To Checkout
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

{% endblock content %}
